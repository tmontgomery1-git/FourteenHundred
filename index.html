<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Anna's Grandma and Grandpa</title>

  <style>
    body {
      margin: 0;
      background: black;
      text-align: center;
    }

    img {
      max-width: 100%;
      max-height: 90vh;
      cursor: pointer;
    }

    audio {
      display: block;
      margin: 10px auto;
    }
  </style>
</head>

<body>

  <img id="picture" src="CountryGrandparents.png"
       alt="Anna's Grandma and Grandpa">

  <audio id="song" controls>
    <source src="./FourteenHundredMiles.mp3" type="audio/mpeg">
  </audio>

  <script>
    const picture = document.getElementById("picture");
    const song = document.getElementById("song");

    picture.addEventListener("click", function() {
      song.style.display = "block";
      song.play();
    });
  </script>

</body>
</html>
